# XcodeGen spec. The .xcodeproj is NOT committed; Codemagic runs `xcodegen generate`.
name: BibleAlarm

options:
  bundleIdPrefix: com.ryder
  developmentLanguage: en
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    # Version shown to users. The build number (CURRENT_PROJECT_VERSION) is
    # overridden on Codemagic so every build gets a new number.
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  BibleAlarm:
    type: application
    platform: iOS
    sources:
      - path: BibleAlarm
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ryder.biblealarm
        PRODUCT_NAME: BibleAlarm
        TARGETED_DEVICE_FAMILY: "1" # iPhone only
        # Info.plist = the keys in Config/Info.plist (permission texts) merged with the
        # INFOPLIST_KEY_ settings below, which Xcode generates.
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_FILE: Config/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: "Bible Alarm"
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: "YES"
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  # Unit tests for the pure logic in BibleAlarm/Core. The Core files are compiled straight into
  # the test bundle, so the tests run without launching the app.
  BibleAlarmTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: BibleAlarmTests
      - path: BibleAlarm/Core
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ryder.biblealarm.tests
        GENERATE_INFOPLIST_FILE: "YES"

schemes:
  BibleAlarm:
    build:
      targets:
        BibleAlarm: all
        BibleAlarmTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - BibleAlarmTests
    archive:
      config: Release
