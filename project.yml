# XcodeGen spec. The .xcodeproj is NOT committed; Codemagic runs `xcodegen generate`.
name: BibleAlarm

options:
  bundleIdPrefix: com.ryder
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    # Version shown to users. The build number (CURRENT_PROJECT_VERSION) is
    # overridden on Codemagic so every build gets a new number.
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  BibleAlarm:
    type: application
    platform: iOS
    sources:
      - path: BibleAlarm
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ryder.biblealarm
        PRODUCT_NAME: BibleAlarm
        TARGETED_DEVICE_FAMILY: "1" # iPhone only
        # Info.plist is generated by Xcode from the INFOPLIST_KEY_ settings below.
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_KEY_CFBundleDisplayName: "Bible Alarm"
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: "YES"
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

schemes:
  BibleAlarm:
    build:
      targets:
        BibleAlarm: all
    run:
      config: Debug
    archive:
      config: Release
