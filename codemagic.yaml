# Codemagic CI.
#
# CURRENT STAGE: no paid Apple Developer account yet, so this builds an
# UNSIGNED .ipa. Ryder downloads it from the Codemagic build page and installs
# it on his iPhone with Sideloadly (Windows) using a free Apple ID.
#
# LATER (after enrolling in the Apple Developer Program): add a signed workflow
# that uses an App Store Connect API key and publishes to TestFlight
# (see PROJECT_BRIEF.md section 9).

workflows:
  ios-unsigned:
    name: iOS unsigned build (Sideloadly)
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      xcode: latest
      vars:
        XCODE_PROJECT: "BibleAlarm.xcodeproj"
        XCODE_SCHEME: "BibleAlarm"
        APP_NAME: "BibleAlarm"
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
    scripts:
      - name: Install XcodeGen
        script: |
          set -e
          if ! command -v xcodegen >/dev/null 2>&1; then
            HOMEBREW_NO_AUTO_UPDATE=1 brew install xcodegen
          fi
          xcodegen --version
          xcodebuild -version
      - name: Generate Xcode project
        script: |
          set -e
          xcodegen generate
      - name: Build app (no code signing)
        script: |
          set -e
          xcodebuild archive \
            -quiet \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "build/$APP_NAME.xcarchive" \
            CURRENT_PROJECT_VERSION="${PROJECT_BUILD_NUMBER:-1}" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO
      - name: Package unsigned .ipa
        script: |
          set -e
          cd build
          rm -rf Payload
          mkdir Payload
          cp -R "$APP_NAME.xcarchive/Products/Applications/$APP_NAME.app" Payload/
          zip -qry "$APP_NAME-unsigned-${PROJECT_BUILD_NUMBER:-1}.ipa" Payload
          rm -rf Payload
          ls -lh ./*.ipa
    artifacts:
      - build/*.ipa
